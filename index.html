<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <style>
        :root {
            --bg: #111214;
            --panel: #18191c;
            --raise: #232529;
            --line: #2e3035;
            --text: #f2f2f2;
            --mute: #9a9da3;
            --hover: #2d2f34;
            --sel: #2b2d31;
            --bad: #ff8a8a;
            color-scheme: dark;
        }

        :root[data-theme=light] {
            --bg: #f4f5f7;
            --panel: #fff;
            --raise: #e9eaee;
            --line: #d0d3d9;
            --text: #15161a;
            --mute: #5f636b;
            --hover: #dcdee3;
            --sel: #e2e4e9;
            --bad: #c62828;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, input {
            font: inherit;
            color: var(--text);
        }

        button {
            background: var(--raise);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        button:hover {
            background: var(--hover);
        }

        input, textarea {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            outline: 0;
        }

        input:focus, textarea:focus, button:focus-visible {
            border-color: #888;
        }

        .gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: grid;
            place-items: center;
        }

        .ban {
            display: grid;
            gap: 14px;
            text-align: center;
            max-width: 420px;
            padding: 24px;
            justify-items: center;
        }

        .ban h2 {
            margin: 0;
            font-size: 32px;
            color: var(--text);
        }

        .ban p {
            margin: 0;
            color: var(--mute);
        }
    </style>
</head>
<body>

    <main class="gate">
        <section class="ban">
            <h2>Maintenance</h2>
            <p>Website under maintenance. Come back later for updates.</p>
        </section>
    </main>

</body>
</html>
