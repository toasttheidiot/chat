<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="style.css?v=15"></head><body>
<div class="gate"><form id="f"><h2>Create account</h2>
  <input name="u" placeholder="Username" autocomplete="username" maxlength="30" required>
  <input name="p" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" required>
  <input name="p2" type="password" placeholder="Confirm password" autocomplete="new-password" required>
  <button>Create account</button><p id="msg"></p>
  <a href="index.html" style="text-align:center;text-decoration:underline">I already have an account</a></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js?v=15"></script>
<script>
const f = $('#f'), msg = $('#msg');
f.onsubmit = async e => {
  e.preventDefault();
  msg.textContent = '';
  const u = f.u.value.trim().toLowerCase();
  if (!/^[^\s@]{2,30}$/.test(u)) return msg.textContent = 'Username must be 2–30 characters with no spaces or @.';
  if (f.p.value.length < 6) return msg.textContent = 'Password must be at least 6 characters.';
  if (f.p.value !== f.p2.value) return msg.textContent = 'Passwords don’t match.';
  const { data, error } = await sb.auth.signUp({ email: u + '@gmail.com', password: f.p.value, options: { data: { username: u } } });
  if (error) return msg.textContent = /registered|database/i.test(error.message) ? 'That username is taken.' : error.message;
  if (!data.session) return msg.textContent = 'Account created, but your Supabase project requires email confirmation. Turn off "Confirm email" under Authentication.';
  location.href = 'index.html';
};
</script></body></html>
