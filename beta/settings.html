<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings (beta)</title><link rel="stylesheet" href="../style.css?v=15"><style>.badge{width:16px;height:16px;flex:none}.rctx{display:grid;gap:4px;max-height:38vh;overflow:auto;margin-top:6px}.cline{padding:6px 8px;border-radius:6px;background:var(--bg);overflow-wrap:anywhere}.cline.target{background:rgba(245,158,11,.15);box-shadow:inset 3px 0 0 #f59e0b}.cline small{color:var(--mute);margin-left:8px}.cline a{display:inline-block;margin-top:4px;text-decoration:underline}.rnote{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<div class="set"><nav id="snav"><h3>Settings</h3></nav><main id="spane"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="../config.js"></script><script src="app.js?v=18"></script>
<script>
const pane = $('#spane'), nav = $('#snav');
const tabs = { 'User info': userInfo, 'Account': account, 'Display': display };
const say = t => { const m = $('#msg'); if (m) m.textContent = t; };

auth().then(() => {
  if (isMod) tabs['Moderator'] = moderator;
  for (const name in tabs) {
    const b = document.createElement('button');
    b.className = 'item'; b.textContent = name;
    b.onclick = () => show(name, b);
    nav.append(b);
  }
  nav.querySelector('.item').click();
});
function show(name, b) {
  nav.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === b));
  pane.innerHTML = `<h2>${name}</h2>`;
  tabs[name]();
}

function userInfo() {
  pane.insertAdjacentHTML('beforeend', `
    <div class="row l"><div class="pfp big" id="av"></div>
      <div><button id="pick">Change picture</button><input id="file" type="file" accept="image/*" hidden>
      <p class="note">PNG, JPG, GIF or WebP, up to 2 MB.</p></div></div>
    <div class="card"><h3>Banner</h3>
      <div id="bprev" class="pbannerprev"></div>
      <div class="row l" style="flex-wrap:wrap">
        <button type="button" id="bpick">Upload image</button><input id="bfile" type="file" accept="image/*" hidden>
        <button type="button" id="brem">Remove image</button>
        <label style="display:flex;align-items:center;gap:8px;margin:0">Color<input type="color" id="bcol" style="width:44px;height:32px;padding:2px"></label>
        <button type="button" id="brst">Reset color</button></div>
      <p class="note">If you set an image it’s used as your banner. Otherwise your banner is the color. Images can be up to 2 MB.</p><p class="note" id="bmsg"></p></div>
    <label>Username<input id="un" maxlength="30"></label>
    <label>Description<textarea id="ds" rows="3" maxlength="150"></textarea></label>
    <div class="card" id="bcard" hidden><h3>Badge</h3><p class="note">Choose which badge shows next to your name.</p><div id="bopts"></div></div>
    <button id="save">Save changes</button><p class="note" id="msg"></p>`);
  paintAvatar($('#av'), profile);
  $('#un').value = profile.username;
  $('#ds').value = profile.description || '';
  const avail = [isMod && 'mod', isBeta && 'beta'].filter(Boolean);
  if (avail.length > 1) {
    $('#bcard').hidden = false;
    for (const k of avail) {
      const l = document.createElement('label');
      l.className = 'chk';
      l.innerHTML = `<input type="radio" name="bd" value="${k}">${badge(k)}<span>${BADGES[k].name}</span>`;
      const r = $('input', l);
      r.checked = profile.badge === k;
      r.onchange = async () => {
        const { error } = await sb.rpc('set_badge', { b: k });
        if (error) return say(error.message);
        profile.badge = k; say('Badge updated.');
      };
      $('#bopts').append(l);
    }
  }
  const bsay = t => {
    $('#bmsg').textContent = /permission denied|does not exist|schema cache|check constraint/i.test(t) ? t + ' Run update_12.sql in the Supabase SQL Editor, then reload.' : t;
  };
  const bp = () => paintBanner($('#bprev'), profile);
  bp();
  $('#bcol').value = profile.banner_color || autoColor(me.id);
  $('#bpick').onclick = () => $('#bfile').click();
  $('#bfile').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) return bsay('Please choose an image file.');
    if (f.size > 2 * 1024 * 1024) return bsay('The image must be under 2 MB.');
    const path = `${me.id}/banner`;
    const up = await sb.storage.from('avatars').upload(path, f, { upsert: true, contentType: f.type });
    if (up.error) return bsay(up.error.message);
    const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const { error } = await sb.from('profiles').update({ banner_url: url }).eq('id', me.id);
    if (error) return bsay(error.message);
    profile.banner_url = url; bp(); bsay('Banner updated.');
  };
  $('#brem').onclick = async () => {
    const { error } = await sb.from('profiles').update({ banner_url: null }).eq('id', me.id);
    if (error) return bsay(error.message);
    sb.storage.from('avatars').remove([`${me.id}/banner`]);
    profile.banner_url = null; bp(); bsay('Banner image removed.');
  };
  $('#bcol').oninput = () => { profile.banner_color = $('#bcol').value; bp(); };
  $('#bcol').onchange = async () => {
    const { error } = await sb.from('profiles').update({ banner_color: $('#bcol').value }).eq('id', me.id);
    bsay(error ? error.message : 'Banner color saved.');
  };
  $('#brst').onclick = async () => {
    const { error } = await sb.from('profiles').update({ banner_color: null }).eq('id', me.id);
    if (error) return bsay(error.message);
    profile.banner_color = null; $('#bcol').value = autoColor(me.id); bp(); bsay('Banner color reset.');
  };
  $('#pick').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) return say('Please choose an image file.');
    if (f.size > 2 * 1024 * 1024) return say('The image must be under 2 MB.');
    const path = `${me.id}/avatar`;
    const up = await sb.storage.from('avatars').upload(path, f, { upsert: true, contentType: f.type });
    if (up.error) return say(up.error.message);
    const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
    if (error) return say(error.message);
    profile.avatar_url = url; paintAvatar($('#av'), profile); say('Picture updated.');
  };
  $('#save').onclick = async () => {
    const un = $('#un').value.trim().toLowerCase(), ds = $('#ds').value.trim(), old = profile.username;
    if (!/^[^\s@]{2,30}$/.test(un)) return say('Username must be 2–30 characters with no spaces or @.');
    if (un !== old) {
      const { error: e1 } = await sb.rpc('change_username', { new_name: un });
      if (e1) return say(e1.message);
      profile.username = un;
    }
    const { error } = await sb.from('profiles').update({ description: ds }).eq('id', me.id);
    if (error) return say(error.message);
    profile.description = ds;
    say(un !== old ? 'Saved. Use your new username next time you sign in.' : 'Saved.');
  };
}

function account() {
  pane.insertAdjacentHTML('beforeend', `
    <div class="card"><h3>Sign out</h3><p class="note">Sign out of this device.</p><button id="out">Sign out</button></div>
    <div class="card"><h3>Delete account</h3><p class="note">Permanently deletes your account, profile and messages. This can’t be undone.</p>
      <button id="del" class="danger">Delete my account</button></div>`);
  $('#out').onclick = signOutNow;
  $('#del').onclick = async () => {
    if (prompt('Type DELETE to permanently delete your account.') !== 'DELETE') return;
    await sb.storage.from('avatars').remove([`${me.id}/avatar`, `${me.id}/banner`]);
    const { error } = await sb.rpc('delete_my_account');
    if (error) return alert(error.message);
    await signOutNow();
  };
}

function display() {
  pane.insertAdjacentHTML('beforeend', `
    <div class="card row"><div><h3>Light mode</h3><p class="note">Use a light color scheme across the whole app.</p></div>
    <input type="checkbox" class="sw" id="lt"></div>`);
  $('#lt').checked = document.documentElement.dataset.theme === 'light';
  $('#lt').onchange = e => setTheme(e.target.checked ? 'light' : 'dark');
}

async function moderator() {
  pane.insertAdjacentHTML('beforeend', `
    <div class="card"><h3>Your powers</h3><p class="note">Right-click any message to edit or delete it. On other people’s messages you also get Manage user, which has Ban and Delete account. Your edits don’t show “edited”.</p></div>
    <div class="card"><h3>Reports</h3><div id="rl" class="note">Loading…</div></div>
    <div class="card"><h3>Banned users</h3><div id="bl" class="note">Loading…</div></div>`);

  const loadBans = async () => {
    const { data = [] } = await sb.from('profiles').select('id,username').eq('banned', true);
    const bl = $('#bl'); bl.innerHTML = data.length ? '' : 'Nobody is banned.';
    for (const u of data) {
      const r = document.createElement('div');
      r.className = 'row'; r.style.marginBottom = '8px';
      r.innerHTML = `<span>${esc(u.username)}</span><button>Unban</button>`;
      r.querySelector('button').onclick = async () => {
        const { error } = await sb.rpc('unban_user', { uid: u.id });
        error ? alert(error.message) : loadBans();
      };
      bl.append(r);
    }
  };

  const viewReport = rp => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="pick rset"><h3>Report</h3><p class="note rwho"></p>
      <div class="rsec"><b>Note</b><p class="rnote"></p></div>
      <div class="rsec"><b>Reported message and the messages around it</b><div class="rctx"></div></div>
      <p class="note rmsg"></p>
      <div class="pfoot" style="justify-content:space-between"><button type="button" class="x">Close</button><div class="rbtns"><button type="button" class="dismiss">Dismiss</button><button type="button" class="banbtn danger">Ban user</button></div></div></div>`;
    document.body.append(m);
    $('.rwho', m).textContent = `${rp.reporter_name || 'deleted user'} reported ${rp.reported_name || 'deleted user'} · ${new Date(rp.created_at).toLocaleString()}`;
    $('.rnote', m).textContent = rp.note || 'No note was added.';
    const box = $('.rctx', m);
    for (const c of rp.context || []) {
      const l = document.createElement('div');
      l.className = 'cline' + (c.target ? ' target' : '');
      const b = document.createElement('b');
      b.textContent = c.username || 'unknown';
      const s = document.createElement('small');
      s.textContent = new Date(c.created_at).toLocaleString();
      const t = document.createElement('div');
      t.textContent = c.content || '';
      l.append(b, s, t);
      if (c.image_url) {
        const a = document.createElement('a');
        a.href = c.image_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Image attachment';
        l.append(a);
      }
      box.append(l);
    }
    box.querySelector('.target')?.scrollIntoView({ block: 'center' });
    const onKey = e => e.key === 'Escape' && close();
    const close = () => { m.remove(); removeEventListener('keydown', onKey); };
    addEventListener('keydown', onKey);
    m.onclick = e => { if (e.target === m) close(); };
    $('.x', m).onclick = close;
    const resolve = async ban => {
      if (ban && !confirm(`Ban ${rp.reported_name}?`)) return;
      const { error } = await sb.rpc('resolve_report', { rid: rp.id, do_ban: ban });
      if (error) { $('.rmsg', m).textContent = error.message; return; }
      close();
      loadReports();
      loadBans();
    };
    $('.dismiss', m).onclick = () => resolve(false);
    $('.banbtn', m).onclick = () => resolve(true);
  };

  const loadReports = async () => {
    const { data, error } = await sb.from('reports').select('*').is('resolved_at', null).order('created_at', { ascending: false });
    const rl = $('#rl');
    if (error) { rl.textContent = error.message; return; }
    rl.innerHTML = (data || []).length ? '' : 'No open reports.';
    for (const rp of data || []) {
      const r = document.createElement('div');
      r.className = 'row'; r.style.marginBottom = '8px';
      r.innerHTML = '<span></span><button>View</button>';
      $('span', r).textContent = `${rp.reporter_name || 'deleted user'} reported ${rp.reported_name || 'deleted user'}`;
      $('button', r).onclick = () => viewReport(rp);
      rl.append(r);
    }
  };

  loadReports();
  loadBans();
}
</script></body></html>
